name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Event timestamps are interpreted in the local timezone, so run the
        # suite in more than one zone to catch timezone-dependent regressions.
        tz: [UTC, America/Halifax]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Reads the `packageManager` field from package.json
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suites
        run: bun test
        env:
          TZ: ${{ matrix.tz }}

  typecheck-and-build:
    name: Typecheck & build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build library (types, CJS, ESM)
        run: bun run build

      - name: Smoke test built CJS bundle under Node
        run: |
          node dist-cjs/cli.cjs count-hours test-fixtures/Events_On_MWF_At_Noon/Events_On_MWF_At_Noon.ics --project ExampleProj1 \
            | tee /dev/stderr | grep -q "Total Hours: 3.00"

      - name: Smoke test built ESM bundle under Node
        run: |
          node dist-esm/cli.mjs count-hours test-fixtures/Events_On_MWF_At_Noon/Events_On_MWF_At_Noon.ics --project ExampleProj1 \
            | tee /dev/stderr | grep -q "Total Hours: 3.00"

  web-build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run web:build
